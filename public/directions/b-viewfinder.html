<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Viewfinder · DeoVR directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/directions.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100dvh; display: grid; grid-template-rows: 1fr auto; }

  .top { position: absolute; inset: 0 0 auto; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: 1rem var(--gutter); }
  .top .sp { flex: 1; }
  .top .icon-btn, .top .btn-ghost { color: var(--text); }

  .stage { position: relative; overflow: hidden; min-height: 0; }
  .stage .media { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto; background: var(--bg); }
  .stage .media > img { transition: opacity var(--d3) var(--ease); }
  .stage .media.swap > img { opacity: 0; transform: scale(1.015); }
  .stage .media > img { transform: scale(1); transition: opacity var(--d3) var(--ease), transform 1.2s var(--ease); }
  .stage .media > video { filter: saturate(1.05); }
  .scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, oklch(0.155 0.006 60 / .92) 0%, oklch(0.155 0.006 60 / .55) 32%, transparent 60%),
      linear-gradient(0deg, var(--bg) 0%, oklch(0.155 0.006 60 / .0) 28%),
      linear-gradient(180deg, oklch(0.155 0.006 60 / .6) 0%, transparent 18%); }
  .info { position: absolute; z-index: 2; left: var(--gutter); bottom: 2.25rem; width: min(40rem, 50%); display: grid; gap: 1rem; }
  .place { color: var(--text-2); font-size: 1rem; }
  .title { margin: .25rem 0 0; font-family: var(--font-display); font-weight: 750; font-stretch: 76%; font-size: clamp(2.75rem, 5.2vw, 5.5rem); line-height: .92; letter-spacing: -0.015em; text-wrap: balance; }
  .hook { margin: 0; color: var(--text-2); font-size: 1.0625rem; max-width: 40ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info .sig { font-size: .9rem; } .info .sig svg { width: 1.15rem; height: 1.15rem; }
  .creator { display: flex; align-items: center; gap: .6rem; font-size: .9rem; font-weight: 500; }
  .creator span { color: var(--text-3); font-weight: 400; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .info > * { transition: opacity var(--d2) var(--ease); }
  .info.swap > * { opacity: 0; }

  .tray { padding: .25rem 0 1.25rem; background: var(--bg); }
  .shelves { display: flex; gap: .25rem; padding: 0 var(--gutter) .75rem; overflow-x: auto; scrollbar-width: none; }
  .shelves button { padding: .4rem .1rem; margin-right: 1.1rem; font-weight: 600; color: var(--text-3); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
  .shelves button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .shelves .n { color: var(--text-3); font-weight: 500; font-size: .8em; margin-left: .3rem; }
  .strip { display: flex; gap: .75rem; overflow-x: auto; padding: .5rem var(--gutter) .5rem; scroll-padding: 0 var(--gutter); scroll-behavior: smooth; scrollbar-width: none; }
  .tile { flex: 0 0 13.5rem; text-align: left; display: grid; gap: .4rem; }
  .tile .media { border-radius: 6px; transition: transform var(--d2) var(--ease); }
  .tile .media img { filter: brightness(.62); transition: filter var(--d2) var(--ease); }
  .tile .media::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow var(--d2) var(--ease); }
  .tile[aria-current="true"] .media { transform: scale(1.04); }
  .tile[aria-current="true"] .media img, .tile:hover .media img { filter: none; }
  .tile[aria-current="true"] .media::after { box-shadow: inset 0 0 0 2px var(--text); }
  .tile:focus-visible { outline: none; }
  .tile-t { font-size: .8125rem; font-weight: 600; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile[aria-current="true"] .tile-t { color: var(--text); }
  .hint { position: absolute; z-index: 2; right: var(--gutter); bottom: 2.4rem; display: flex; gap: 1rem; color: var(--text-3); font-size: .8rem; }
  .hint kbd { font: inherit; padding: .05rem .4rem; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text-2); }

  html[data-view="headset"] .tile { flex-basis: 17rem; }
  html[data-view="headset"] .shelves button { min-height: var(--target); }
  html[data-view="headset"] .info { width: min(36rem, 55%); }
  html[data-view="headset"] .hint { display: none; }

  @media (max-width: 760px) {
    html, body { overflow: auto; height: auto; }
    .app { height: auto; grid-template-rows: auto auto; }
    .stage { aspect-ratio: auto; display: grid; }
    .stage .media { position: relative; aspect-ratio: 5 / 3; }
    .scrim { display: none; }
    .info { position: static; width: auto; padding: 1rem var(--gutter) 1.25rem; }
    .hint { display: none; }
    .tile { flex-basis: 10rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a href="#" aria-label="DeoVR home" id="logo"></a>
    <span class="sp"></span>
    <button class="icon-btn" aria-label="Search" id="b-search"></button>
    <button class="btn btn-ghost" id="b-queue"></button>
    <button class="btn btn-secondary">Sign in</button>
  </header>

  <main class="stage" aria-live="polite">
    <div class="media" id="stage-media"></div>
    <div class="scrim"></div>
    <div class="info" id="info"></div>
    <div class="hint" aria-hidden="true"><span><kbd>←</kbd> <kbd>→</kbd> browse</span><span><kbd>↑</kbd> <kbd>↓</kbd> shelf</span><span><kbd>Enter</kbd> details</span></div>
  </main>

  <nav class="tray" aria-label="Browse">
    <div class="shelves" id="shelves" role="tablist"></div>
    <div class="strip" id="strip" role="listbox" aria-label="Videos"></div>
  </nav>
</div>

<script src="assets/data.js"></script>
<script src="assets/directions.js"></script>
<script>
const { videos, featured, channels, icon, logo, esc, dur, count, cleanTitle, signature, fovGlyph, queue, EDIT } = X;
document.getElementById('logo').innerHTML = logo;
document.getElementById('b-search').innerHTML = icon.search;
const qb = document.getElementById('b-queue');
const paintQ = () => (qb.innerHTML = `${icon.queue} Queue${queue.size ? ` · ${queue.size}` : ''}`);
paintQ(); X.onQueue(() => { paintQ(); renderInfo(current(), false); });

const by = (fn) => [...videos].sort(fn);
const SHELVES = [
  ['Featured', featured],
  ['For you', by((a, b) => (a.feeds.home ?? 999) - (b.feeds.home ?? 999))],
  ['Trending', by((a, b) => (a.feeds.trending ?? 999) - (b.feeds.trending ?? 999))],
  ['Travel', videos.filter((v) => v.intents.includes('travel'))],
  ['Nature & calm', videos.filter((v) => v.intents.includes('nature') && v.comfort !== 'moving')],
  ['Music & events', videos.filter((v) => v.intents.includes('music'))],
  ['Adrenaline', videos.filter((v) => v.intents.includes('adrenaline') || v.comfort === 'moving' && v.intents.includes('travel'))],
  ['360°', videos.filter((v) => v.fov === 360)],
  ['Passthrough', videos.filter((v) => v.passthrough)],
].map(([n, l]) => [n, l.slice(0, 24)]);

let s = 0, i = 0, swapT, prevT;
const current = () => SHELVES[s][1][i];

function renderInfo(v, animate) {
  const e = EDIT[v.slug] || {}, c = channels.get(v.channel) || {};
  const info = document.getElementById('info');
  const html = `
    <div><div class="place">${esc(e.place || c.name || '')}</div>
    <h1 class="title">${esc(e.headline || cleanTitle(v.title))}</h1></div>
    ${e.hook ? `<p class="hook">${esc(e.hook)}</p>` : ''}
    ${signature(v, { length: true })}
    <div class="creator"><img class="avatar" src="${c.avatar || ''}" alt="">${esc(c.name || v.channel)}<span>${count(v.views)} views</span></div>
    <div class="actions">
      <button class="btn btn-primary">${icon.headset}Watch in VR</button>
      <button class="btn btn-secondary" data-q="${v.slug}">${queue.has(v.slug) ? icon.check + 'Queued' : icon.plus + 'Queue'}</button>
      <button class="btn btn-ghost" data-open="${v.slug}">${icon.info}Details</button>
    </div>`;
  if (!animate) { info.innerHTML = html; return; }
  info.classList.add('swap');
  setTimeout(() => { info.innerHTML = html; info.classList.remove('swap'); }, 160);
}

function focusItem(n, { scroll = true, animate = true } = {}) {
  const list = SHELVES[s][1];
  i = Math.max(0, Math.min(list.length - 1, n));
  const v = list[i];
  document.querySelectorAll('.tile').forEach((t, j) => { t.setAttribute('aria-current', j === i); t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; });
  const tile = document.querySelectorAll('.tile')[i];
  if (scroll) tile?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  renderInfo(v, animate);
  const m = document.getElementById('stage-media');
  clearTimeout(swapT); clearTimeout(prevT);
  X.stopPreview();
  m.classList.add('swap');
  swapT = setTimeout(() => {
    m.dataset.preview = v.preview;
    m.innerHTML = `<img src="${v.cover.lg || v.cover.sm}" alt="">`;
    m.querySelector('img').onload = () => m.classList.remove('swap');
    // Tier 2: stage stays a sharp still; the 300p preview plays inside the focused tile, where it's sharp.
    prevT = setTimeout(() => X.startPreview(document.querySelectorAll('.tile')[i]?.querySelector('.media')), 500);
  }, animate ? 180 : 0);
}

function renderShelf(n) {
  s = (n + SHELVES.length) % SHELVES.length;
  document.getElementById('shelves').innerHTML = SHELVES.map(([name, l], j) => `<button role="tab" aria-selected="${j === s}" data-s="${j}">${name}<span class="n">${l.length}</span></button>`).join('');
  document.getElementById('strip').innerHTML = SHELVES[s][1].map((v, j) => `
    <button class="tile" role="option" data-i="${j}">
      <div class="media" data-preview="${v.preview}"><img src="${v.cover.sm || v.cover.lg}" alt="" loading="lazy"><span class="badge br">${dur(v.durationSec)}</span></div>
      <div class="tile-t">${esc(EDIT[v.slug]?.headline || cleanTitle(v.title))}</div>
    </button>`).join('');
  document.getElementById('strip').scrollLeft = 0;
  focusItem(0, { scroll: false });
}

// Pointer: dwell on a tile to focus it (ray-friendly; no accidental swaps while sweeping).
let dwellT;
document.getElementById('strip').addEventListener('pointerover', (e) => {
  const t = e.target.closest('.tile'); if (!t) return;
  clearTimeout(dwellT);
  dwellT = setTimeout(() => +t.dataset.i !== i && focusItem(+t.dataset.i, { scroll: false }), parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dwell')));
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('.tile');
  if (t) { +t.dataset.i === i ? X.quickView(current().slug) : focusItem(+t.dataset.i); }
  const sh = e.target.closest('[data-s]'); if (sh) renderShelf(+sh.dataset.s);
  const o = e.target.closest('[data-open]'); if (o) X.quickView(o.dataset.open);
  const q = e.target.closest('[data-q]'); if (q) X.toggleQueue(q.dataset.q);
});
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  const k = e.key;
  if (k === 'ArrowRight') focusItem(i + 1);
  else if (k === 'ArrowLeft') focusItem(i - 1);
  else if (k === 'ArrowDown') renderShelf(s + 1);
  else if (k === 'ArrowUp') renderShelf(s - 1);
  else if (k === 'Enter' && !e.target.closest('button:not(.tile)')) X.quickView(current().slug);
  else return;
  e.preventDefault();
});
renderShelf(0);
X.toolbar('b');
</script>
</body>
</html>
